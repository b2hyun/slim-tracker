function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var TODAY=todayStr(),DOW=new Date().getDay(),VDATE=TODAY;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

/* ── 저장 · 마이그레이션 (구 SLIM·TRACK / 바프 앱 데이터를 자동으로 읽어온다) ── */
var LKEY="bodytrack:v1";
/* ── IndexedDB: 사진 전용 저장 (localStorage 5MB 한도 회피) ── */
function idbOpen(cb){try{var r=indexedDB.open("bodytrack",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function idbSet(k,v,cb){idbOpen(function(db){if(!db){if(cb)cb(false);return;}try{var tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=function(){if(cb)cb(true);};tx.onerror=function(){if(cb)cb(false);};}catch(e){if(cb)cb(false);}});}
function idbGet(k,cb){idbOpen(function(db){if(!db){cb(null);return;}try{var rq=db.transaction("kv").objectStore("kv").get(k);rq.onsuccess=function(){cb(rq.result);};rq.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function savePhotos(cb){idbSet("photos",state.photos||[],cb);}
var state={mode:"home",workout:{},diet:{},metrics:[],tab:"today",plan:"A",photos:[],lastBackup:null,checks:{},settings:{},myfoods:[],myplan:[],swap:null,daily:{},supps:["크레아틴 5g","종합비타민","오메가3"],deload:null};
function save(){try{localStorage.setItem(LKEY,JSON.stringify({mode:state.mode,workout:state.workout,diet:state.diet,metrics:state.metrics,plan:state.plan,lastBackup:state.lastBackup,checks:state.checks,settings:state.settings,myfoods:state.myfoods,myplan:state.myplan,swap:state.swap,daily:state.daily,supps:state.supps,deload:state.deload}));return true;}catch(e){return false;}}
function migrateBP(entries){
 if(!entries)return;
 var have={};state.metrics.forEach(function(m){have[m.date]=true;});
 Object.keys(entries).forEach(function(d){var e=entries[d]||{};
  if((e.weight!=null||e.waist!=null)&&!have[d]){state.metrics.push({date:d,weight:e.weight!=null?e.weight:null,waist:e.waist!=null?e.waist:null});have[d]=true;}
  if((e.kcal!=null||e.protein!=null)&&!(state.diet[d]&&state.diet[d].items&&state.diet[d].items.length)){
   var p=e.protein||0,c=e.kcal||0;
   state.diet[d]={p:p,c:c,items:[{n:"바프 앱 기록"+(e.note?" · "+e.note:""),p:p,c:c}]};}
 });
 state.metrics.sort(function(a,b){return a.date.localeCompare(b.date);});
}
(function load(){
 try{var raw=localStorage.getItem(LKEY);if(raw){state=Object.assign(state,JSON.parse(raw));return;}}catch(e){}
 var migrated=false;
 try{var slim=localStorage.getItem("slimtrack:v2");if(slim){var o=JSON.parse(slim);state=Object.assign(state,{mode:o.mode||"home",workout:o.workout||{},diet:o.diet||{},metrics:o.metrics||[],plan:o.plan||"A",photos:o.photos||[],lastBackup:o.lastBackup||null});migrated=true;}}catch(e){}
 try{var bp=localStorage.getItem("bp_entries_v1");if(bp){migrateBP(JSON.parse(bp));migrated=true;}}catch(e){}
 try{var ck=localStorage.getItem("bp_checks_v1");if(ck){state.checks=JSON.parse(ck)||{};}}catch(e){}
 try{var st=localStorage.getItem("bp_settings_v1");if(st){state.settings=JSON.parse(st)||{};}}catch(e){}
 if(migrated)save();
})();
/* 사진 로드: IDB 우선, 레거시 localStorage 사진은 IDB로 이전 */
idbGet("photos",function(ph){
 var legacy=state.photos&&state.photos.length?state.photos:null;
 if(ph&&ph.length){state.photos=ph;if(legacy&&legacy.length>ph.length){/* 레거시가 더 많으면 병합 */var seen={};ph.forEach(function(x){seen[x.date+(x.img||"").slice(-20)]=1;});legacy.forEach(function(x){if(!seen[x.date+(x.img||"").slice(-20)])state.photos.push(x);});savePhotos();}}
 else if(legacy){state.photos=legacy;savePhotos(function(){save();});}
 render();
});

/* ── 단계 계산 ── */
function trainPhaseIdx(){var t=new Date(),idx=0;for(var i=0;i<TPHASES.length;i++){if(TPHASES[i].start<=t)idx=i;}return idx;}
function trainPhase(){return TPHASES[trainPhaseIdx()];}
function dietPhaseBase(){for(var i=0;i<DPHASES.length;i++){if(TODAY<=DPHASES[i].until)return DPHASES[i];}return DPHASES[DPHASES.length-1];}
function dietPhase(){var b=dietPhaseBase(),s=state.settings||{};
 return {name:b.name,until:b.until,cut:b.cut,startRef:b.startRef,
  goal:s.goal!=null?s.goal:b.goal,kcal:s.kcal!=null?s.kcal:b.kcal,protein:s.protein!=null?s.protein:b.protein};}
function dDay(){return Math.max(0,Math.ceil((new Date(dietPhase().until)-new Date(TODAY))/864e5));}
function blockNo(){var wk=Math.floor((new Date()-START)/(7*864e5));return Math.max(1,Math.floor(wk/2)+1);}
function overallPct(){return Math.max(0,Math.min(1,(new Date()-START)/(END-START)));}
var PHOTO_MAX=200;
function isMaint(){return new Date()>END;}

/* ── 적응형 스케줄: 어제 놓친 세션 감지 + 오늘 세션 수동 교체 ── */
var SWCH=false;
function anyDone(d){var w=state.workout[d];if(!w)return false;for(var k in w){if(w[k]&&w[k].done)return true;}return false;}
function yIso(){var y=new Date();y.setDate(y.getDate()-1);return isoDate(y);}
function missedInfo(){
 var yi=yIso();
 var key=trainPhase().sched[(DOW+6)%7];
 if(!key||key==="rest")return null;
 if(anyDone(yi))return null;
 return {key:key,date:yi};}

/* ── 디로드 주간 (7일 후 자동 종료) ── */
function deloadDay(){if(!state.deload)return null;var n=daysSince(state.deload.start);if(n==null||n>=7||n<0)return null;return n+1;}
function deloadActive(){return deloadDay()!=null;}
window.toggleDeload=function(){
 if(deloadActive()){if(!confirm("디로드 주간을 종료할까요?"))return;state.deload=null;}
 else{if(!confirm("디로드 주간을 시작할까요? 7일간 중량 60%·세트 절반 목표가 표시되고, 이후 자동 종료돼요."))return;state.deload={start:TODAY};}
 save();render();};

/* ── 물 · 영양제 데일리 체크 ── */
function dailyOf(dt){var x=state.daily[dt]||(state.daily[dt]={w:0,s:{}});if(x.s===undefined)x.s={};if(x.w===undefined)x.w=0;return x;}
window.addWater=function(n){var d=dailyOf(VDATE);d.w=Math.max(0,(d.w||0)+n);save();render();};
window.toggleSupp=function(i){var d=dailyOf(VDATE);var k=state.supps[i];if(!k)return;d.s[k]=!d.s[k];save();render();};
window.addSupp=function(){var el=document.getElementById('suppIn');var v=(el&&el.value||"").trim();if(!v)return;state.supps=state.supps||[];if(state.supps.indexOf(v)>-1)return;state.supps.push(v);save();render();};
window.delSupp=function(i){if(!confirm("'"+state.supps[i]+"' 항목을 삭제할까요?"))return;state.supps.splice(i,1);save();render();};
function swapDecided(){return state.swap&&state.swap.date===TODAY;}

function progHint(exId,spec,inc){if(!spec)return null;var ls=lastSets(exId);if(!ls||ls.length<spec.sets)return null;

 for(var i=0;i<spec.sets;i++){var s=ls[i];if(!s)return null;var w=parseFloat(s.w),r=parseFloat(s.r);if(!w||!r||r<spec.hi||Math.abs(w-w0)>0.01)return null;}
 return w0+inc;}

 return false;}

 if(waists.length<2)return null;
 var mn=Math.min.apply(null,waists),last=waists[waists.length-1];
 if(last>mn+3)return "⚠️ 복근 가드레일 초과 — 허리 "+last+"cm (최저점 "+mn+"cm +3cm 초과). 벌크를 멈추고 미니컷(칼로리 -600)으로 전환할 신호.";

var TIMER=null,TIMER_IV=null;
function beep(){try{var ctx=new (window.AudioContext||window.webkitAudioContext)();var t0=ctx.currentTime;[0,0.25].forEach(function(dt,i){var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=i?1174:880;g.gain.setValueAtTime(0.25,t0+dt);g.gain.exponentialRampToValueAtTime(0.001,t0+dt+0.18);o.start(t0+dt);o.stop(t0+dt+0.2);});}catch(e){}
 if(navigator.vibrate)try{navigator.vibrate([200,100,200]);}catch(e){}}
function tickTimer(){var el=document.getElementById('restTimer');if(!TIMER){if(el)el.style.display='none';return;}
 var left=Math.ceil((TIMER.end-Date.now())/1000);
 if(left<=0){beep();TIMER=null;clearInterval(TIMER_IV);TIMER_IV=null;
  if(el){el.textContent='휴식 끝! 다음 세트 💪';el.style.display='';setTimeout(function(){var e2=document.getElementById('restTimer');if(e2&&!TIMER)e2.style.display='none';},2500);}return;}
 if(el){el.style.display='';el.textContent='⏱ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+'  (탭하면 취소)';}}
window.startTimer=function(sec){TIMER={end:Date.now()+sec*1000,dur:sec};if(TIMER_IV)clearInterval(TIMER_IV);TIMER_IV=setInterval(tickTimer,250);tickTimer();};

function freqFoods(){var cnt={};
 Object.keys(state.diet).forEach(function(d){(state.diet[d].items||[]).forEach(function(it){
  if(/^[A-D] /.test(it.n)||it.n.indexOf("바프 앱 기록")===0)return;
  var k=it.n+"\u0001"+it.p+"\u0001"+it.c+"\u0001"+(it.f||0)+"\u0001"+(it.b||0);cnt[k]=(cnt[k]||0)+1;});});
 return Object.keys(cnt).map(function(k){var a=k.split("\u0001");return {n:a[0],p:+a[1],c:+a[2],f:+a[3],b:+a[4],cnt:cnt[k]};})

/* 초성 검색 지원: "ㅁㄹㅌ" → 마라탕 */
var CHO_LIST="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function choseong(s){var out="";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c>=0xAC00&&c<=0xD7A3)out+=CHO_LIST[Math.floor((c-0xAC00)/588)];else out+=s[i];}return out;}
function fdMatch(){var q=SQ.trim().toLowerCase();if(!q)return [];
 var isCho=/^[ㄱ-ㅎ\s]+$/.test(q);var qc=q.replace(/\s/g,"");
 var A=allFoods(),out=[];
 for(var i=0;i<A.length;i++){var it=A[i],hit;
  if(isCho){if(it._k===undefined)it._k=choseong(it.n);hit=it._k.indexOf(qc)>-1;}
  else{if(it._s===undefined)it._s=it.n.toLowerCase();hit=it._s.indexOf(q)>-1;}
  if(hit){out.push(i);if(out.length>=12)break;}}
 return out;}

/* ── 바코드 스캔 (BarcodeDetector + Open Food Facts) ── */
var BFOUND=null;
function parseOFF(j,code){
 if(!j||j.status!==1||!j.product)return null;
 var pr=j.product,n=pr.nutriments||{};
 var name=(pr.product_name_ko||pr.product_name||"").trim();
 if(!name)name="제품 "+code;
 if(pr.brands){var br=(""+pr.brands).split(",")[0].trim();if(br&&name.indexOf(br)<0)name=br+" "+name;}
 var u,kcal,pro,carb,fat;
 if(n["energy-kcal_serving"]!=null&&pr.serving_size){u=(""+pr.serving_size).slice(0,16);kcal=n["energy-kcal_serving"];pro=n["proteins_serving"];carb=n["carbohydrates_serving"];fat=n["fat_serving"];}
 else{u="100g";kcal=n["energy-kcal_100g"];pro=n["proteins_100g"];carb=n["carbohydrates_100g"];fat=n["fat_100g"];}
 if(kcal==null||isNaN(kcal))return null;
 return {n:name,u:u,p:Math.round(pro||0),c:Math.round(kcal),f:Math.round(fat||0),b:Math.round(carb||0)};
}
window.scanBarcode=function(){

 var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px";
 var v=document.createElement("video");v.setAttribute("playsinline","");v.muted=true;v.style.cssText="max-width:100%;max-height:66vh;border-radius:10px";
 var msg=document.createElement("div");msg.style.cssText="color:#fff;font-size:14px;margin-top:14px;text-align:center";msg.textContent="바코드를 화면 중앙에 맞춰주세요";
 var mrow=document.createElement("div");mrow.style.cssText="display:flex;gap:8px;margin-top:16px";
 var mbtn=document.createElement("button");mbtn.textContent="번호 직접 입력";mbtn.style.cssText="background:#333;color:#fff;border-radius:8px;padding:10px 18px;font-size:14px";
 var close=document.createElement("button");close.textContent="닫기";close.style.cssText="background:#fff;color:#000;border-radius:8px;padding:10px 20px;font-size:14px";
 mrow.appendChild(mbtn);mrow.appendChild(close);
 ov.appendChild(v);ov.appendChild(msg);ov.appendChild(mrow);document.body.appendChild(ov);
 var stream=null,stopped=false,det;
 try{det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});}catch(e){try{det=new BarcodeDetector();}catch(e2){det=null;}}
 function cleanup(){stopped=true;if(stream)stream.getTracks().forEach(function(t){t.stop();});if(ov.parentNode)ov.parentNode.removeChild(ov);}
 close.onclick=cleanup;
 mbtn.onclick=function(){cleanup();window.barcodeManual();};
 if(!det){cleanup();window.barcodeManual();return;}
 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){stream=s;v.srcObject=s;v.play();setTimeout(loop,600);}).catch(function(){cleanup();window.barcodeManual();});
 function loop(){if(stopped)return;det.detect(v).then(function(codes){if(stopped)return;if(codes&&codes.length&&codes[0].rawValue){var code=codes[0].rawValue;cleanup();window.lookupBarcode(code);return;}setTimeout(loop,400);}).catch(function(){if(!stopped)setTimeout(loop,400);});}
};

function spark(vals,color){var W=448,H=104,pad=24;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mn===mx){mn-=1;mx+=1;}var x=function(i){return pad+(vals.length<2?0.5:(i/(vals.length-1)))*(W-pad*2);};var y=function(v){return pad+(1-(v-mn)/(mx-mn))*(H-pad*2);};var path=vals.map(function(v,i){return (i?"L":"M")+x(i)+","+y(v);}).join(" ");var dots=vals.map(function(v,i){return '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+color+'"/>';}).join("");return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'<text x="'+pad+'" y="'+(y(mx)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mx+'</text><text x="'+pad+'" y="'+(y(mn)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mn+'</text></svg>';}

function coachSignals(){var dp=dietPhase(),out=[],cut=dp.cut;
 var g=guardInfo();if(g)out.push({t:"warn",x:g});
 /* 체지방 밴드(11~14%) 감시 — 인바디 기록 기반 */
 var bfs=state.metrics.filter(function(m){return m.bf!=null;});
 if(bfs.length){var bf=bfs[bfs.length-1].bf;
  if(!cut&&bf>14)out.push({t:"warn",x:"체지방 "+bf+"% — 밴드(11~14%) 상단 초과. 벌크를 멈추고 미니컷으로 전환할 신호"});
  else if(cut&&bf<=11)out.push({t:"info",x:"체지방 "+bf+"% — 목표 밴드 하단 도달. 컷 조기 종료를 검토하세요 (더 깎으면 근손실 구간)"});}
 KEYLIFTS.forEach(function(k){var h=liftHist(k[0]);if(h.length>=3){var n=h.length,a=h[n-3].w,b=h[n-1].w;if(b<=a&&!deloadActive())out.push({t:"warn",x:k[1]+" 3회째 무게 정체 ("+a+"→"+b+"kg) — 반복수를 한 단계 낮추고 무게를 올려보거나, 오늘 탭 '디로드' 버튼으로 한 주 가볍게 후 재시도"});}});
 var wa=weekAvg();
 if(wa.logged>=3&&wa.ap<Math.round(dp.protein*0.9))out.push({t:"warn",x:"최근 7일 단백질 평균 "+wa.ap+"g (목표 "+dp.protein+"g 미달) — 끼니마다 단백질 한 가지(계란·프로틴·그릭요거트) 추가"});
 var ms=state.metrics.filter(function(m){return m.weight!=null&&daysSince(m.date)!=null&&daysSince(m.date)<=21;}).sort(function(a,b){return a.date.localeCompare(b.date);});
 if(ms.length>=2){var f=ms[0],l=ms[ms.length-1],span=Math.max(1,(new Date(l.date)-new Date(f.date))/864e5),perWk=(l.weight-f.weight)/(span/7);
  if(cut){if(perWk>-0.1&&span>=10)out.push({t:"warn",x:"체중이 "+Math.round(span)+"일간 거의 안 줄었어요 ("+f.weight+"→"+l.weight+"kg) — 칼로리를 약 150 줄이기(탄수에서)"});else if(perWk<-1)out.push({t:"warn",x:"체중 감량이 너무 빨라요 (주 "+(Math.round(perWk*10)/10)+"kg) — 근손실 위험, 살짝 더 먹기"});}
  else{if(perWk<0.05&&span>=14)out.push({t:"info",x:"사이즈업 단계인데 체중이 "+Math.round(span)+"일간 안 늘었어요 — 칼로리를 약 150 늘리기"});else if(perWk>0.6)out.push({t:"warn",x:"체중이 빠르게 늘고 있어요 (주 "+(Math.round(perWk*10)/10)+"kg) — 지방 증가 위험, 칼로리 약간 줄이기"});}}
 var wc=workoutsInWindow(14);
 if(wc<6)out.push({t:"warn",x:"최근 14일 운동 "+wc+"회 — 빈도가 낮아요. 주 4~5회 회복이 우선"});
 if(!out.length)out.push({t:"good",x:"지표가 안정적이에요. 지금 루틴·식단 그대로 유지하면 돼요."});
 return out;}
function summaryText(){var win=recentDays(14),tp=trainPhase(),dp=dietPhase(),L=[];

 var ms=state.metrics.filter(function(m){return m.weight!=null&&daysSince(m.date)!=null&&daysSince(m.date)<=14;}).sort(function(a,b){return a.date.localeCompare(b.date);});
 if(ms.length<3)return null;
 var f=ms[0],l=ms[ms.length-1],span=(new Date(l.date)-new Date(f.date))/864e5;

 if(remain<=0)return {done:true};

 var proj=new Date(l.date);proj.setDate(proj.getDate()+Math.round(weeks*7));

  '<div style="font-size:13px;line-height:1.45;'+(on?'color:'+MUT+';text-decoration:line-through;':'')+'">'+item+'</div></button>';}).join("");
 var checklist='<div class="card" style="padding:14px 16px;margin-top:14px"><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em;margin-bottom:4px">체크리스트 ('+ckDone+'/'+CHECK_ITEMS.length+')</div>'+ckRows+'</div>';
 var inp=function(id,ph2,val){return '<input id="'+id+'" inputmode="decimal" placeholder="'+ph2+'" value="'+(val!=null?val:'')+'" style="width:100%;background:'+SURF2+';border:1px solid '+LINE+';border-radius:9px;color:'+TX+';padding:10px;font-size:14px;text-align:center">';};
 var settings='<div class="card" style="padding:16px;margin-top:14px"><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em;margin-bottom:8px">설정 — 내 목표로 바꾸기</div>'+
  '<div style="font-size:12px;color:'+MUT+';margin-bottom:10px">비워두면 단계 기본값('+dpb.goal.toFixed(1)+'kg · '+dpb.kcal.toLocaleString()+'kcal · '+dpb.protein+'g)이 자동 적용돼요. 다른 사람에게 공유했다면 여기서 자기 목표만 넣으면 됨.</div>'+
  '<div style="display:flex;gap:8px;margin-bottom:10px">'+
  '<div style="flex:1"><div style="font-size:11px;color:'+MUT+';margin-bottom:5px">목표 체중 kg</div>'+inp("sGoal",dpb.goal.toFixed(1),s.goal)+'</div>'+
  '<div style="flex:1"><div style="font-size:11px;color:'+MUT+';margin-bottom:5px">일일 칼로리</div>'+inp("sKcal",dpb.kcal,s.kcal)+'</div>'+
  '<div style="flex:1"><div style="font-size:11px;color:'+MUT+';margin-bottom:5px">단백질 g</div>'+inp("sProtein",dpb.protein,s.protein)+'</div></div>'+
  '<div style="display:flex;gap:8px"><button onclick="saveSettings()" style="flex:1;background:'+ACC+';color:#1a1206;font-weight:700;border-radius:9px;padding:10px 0;font-size:13px">설정 저장</button>'+
  '<button onclick="clearSettings()" style="flex:1;background:'+SURF2+';border:1px solid '+LINE+';color:'+TX+';border-radius:9px;padding:10px 0;font-size:13px">기본값으로</button></div>'+
  '<button onclick="resetAll()" style="width:100%;margin-top:8px;background:transparent;border:1px solid '+CRIT+'55;color:'+CRIT+';border-radius:9px;padding:10px 0;font-size:13px">전체 데이터 초기화</button></div>';
 return '<div class="pane">'+
  '<div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px">2026 → 2030 프로그램</div>'+
  (isMaint()?'<div class="card" style="padding:12px 14px;margin-bottom:14px;border-color:'+TEAL+'55"><span class="mono" style="font-size:11px;color:'+TEAL+'">유지 모드</span><div style="font-size:12px;color:'+MUT+';margin-top:4px">5단계 프로그램을 완료했어요. 지금 체형을 유지하며 P5 루틴·식단을 그대로 쓰면 돼요.</div></div>':'<div style="font-size:12px;color:'+MUT+';margin-bottom:14px">날짜가 지나면 훈련 단계(P1~P5)와 식단 단계(컷/벌크)가 각각 자동 전환된다. 무게는 본인 기록에서 자동 계산.</div>')+
  '<div style="display:flex;gap:4px;margin-bottom:16px">'+segs+'</div>'+cards+
  roadmap+miles+checklist+settings+
  '<div style="font-size:11px;color:'+MUT+';margin-top:10px;line-height:1.5">정체되거나 사진으로 조정하고 싶을 때는 진척 탭 → 내보내기로 기록을 코치에게 전달하면 그 2주만 미세조정.</div></div>';}

function render(){var tp=trainPhase(),dp=dietPhase();
 var body=state.tab==="today"?viewToday():state.tab==="fuel"?viewFuel():state.tab==="plan"?viewPlan():viewProgress();
 var tabs=[["today","오늘"],["fuel","연료"],["progress","진척"],["plan","플랜"]].map(function(t){return '<button class="tabbtn'+(state.tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("");
 document.getElementById("app").innerHTML=
  '<div class="wrap"><div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:4px">'+
  '<div style="font-weight:700;font-size:19px;letter-spacing:-.02em">바프<span style="color:'+ACC+'">·</span>트랙</div>'+
  '<div class="mono" style="font-size:11px;color:'+MUT+'">'+(isMaint()?'유지 모드 · '+tp.id:tp.id+' · '+dp.name)+'</div></div>'+
  '<div style="height:3px;background:'+SURF2+';border-radius:2px;margin-bottom:22px;overflow:hidden"><div style="width:'+(overallPct()*100)+'%;height:100%;background:'+ACC+'"></div></div>'+
  body+'</div>'+
  '<div class="tabbar"><div class="tabbar-in">'+tabs+'</div></div>'+
  ((PVIEW!=null&&state.photos&&state.photos[PVIEW])?'<div onclick="closePhoto()" style="position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"><img src="'+state.photos[PVIEW].img+'" style="max-width:100%;max-height:88vh;border-radius:10px"><div style="position:absolute;top:16px;right:20px;color:#fff;font-size:26px">×</div></div>':'')+
  ((CSEL.length===2&&state.photos)?(function(){var a=state.photos[CSEL[0]],b=state.photos[CSEL[1]];if(!a||!b)return '';var pair=[a,b].sort(function(x,y){return x.date.localeCompare(y.date);});
   return '<div onclick="closeCmp()" style="position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;gap:8px">'+
   pair.map(function(p){return '<div style="flex:1;min-width:0;text-align:center"><img src="'+p.img+'" style="width:100%;max-height:80vh;object-fit:contain;border-radius:10px"><div class="mono" style="color:#fff;font-size:12px;margin-top:6px">'+p.date+'</div></div>';}).join("")+
   '<div style="position:absolute;top:16px;right:20px;color:#fff;font-size:26px">×</div></div>';})():'')+
  '<div id="restTimer" onclick="cancelTimer()" style="display:'+(TIMER?'':'none')+';position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:'+ACC+';color:#1a1206;font-weight:700;border-radius:999px;padding:10px 18px;font-size:14px;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.4)" class="mono"></div>';
 tickTimer();}

render();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
