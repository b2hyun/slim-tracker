function migrateBP(entries){
 if(!entries)return;
 var have={};state.metrics.forEach(function(m){have[m.date]=true;});
 Object.keys(entries).forEach(function(d){var e=entries[d]||{};
  if((e.weight!=null||e.waist!=null)&&!have[d]){state.metrics.push({date:d,weight:e.weight!=null?e.weight:null,waist:e.waist!=null?e.waist:null});have[d]=true;}
  if((e.kcal!=null||e.protein!=null)&&!(state.diet[d]&&state.diet[d].items&&state.diet[d].items.length)){
   var p=e.protein||0,c=e.kcal||0;
   state.diet[d]={p:p,c:c,items:[{n:"바프 앱 기록"+(e.note?" · "+e.note:""),p:p,c:c}]};}
 });
 state.metrics.sort(function(a,b){return a.date.localeCompare(b.date);});
}

/* ── 단계 계산 ── */
function trainPhaseIdx(){var t=new Date(),idx=0;for(var i=0;i<TPHASES.length;i++){if(TPHASES[i].start<=t)idx=i;}return idx;}
function trainPhase(){return TPHASES[trainPhaseIdx()];}
function dietPhaseBase(){for(var i=0;i<DPHASES.length;i++){if(TODAY<=DPHASES[i].until)return DPHASES[i];}return DPHASES[DPHASES.length-1];}
function dietPhase(){var b=dietPhaseBase(),s=state.settings||{};
 return {name:b.name,until:b.until,cut:b.cut,startRef:b.startRef,
  goal:s.goal!=null?s.goal:b.goal,kcal:s.kcal!=null?s.kcal:b.kcal,protein:s.protein!=null?s.protein:b.protein};}
function dDay(){return Math.max(0,Math.ceil((new Date(dietPhase().until)-new Date(TODAY))/864e5));}
function blockNo(){var wk=Math.floor((new Date()-START)/(7*864e5));return Math.max(1,Math.floor(wk/2)+1);}
function overallPct(){return Math.max(0,Math.min(1,(new Date()-START)/(END-START)));}
var PHOTO_MAX=60;
function isMaint(){return new Date()>END;}

/* ── 스트릭 (식단·운동·신체 기록 중 하나라도 있으면 그날은 기록한 날) ── */
function hasRecord(d){
 if(state.diet[d]&&state.diet[d].items&&state.diet[d].items.length)return true;
 var w=state.workout[d];if(w){for(var k in w){if(w[k]&&w[k].done)return true;}}

 return false;}
function isoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function calcStreak(){var n=0,d=new Date();if(!hasRecord(TODAY))d.setDate(d.getDate()-1);while(hasRecord(isoDate(d))){n++;d.setDate(d.getDate()-1);}return n;}

 return null;}

/* 초성 검색 지원: "ㅁㄹㅌ" → 마라탕 */
var CHO_LIST="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function choseong(s){var out="";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c>=0xAC00&&c<=0xD7A3)out+=CHO_LIST[Math.floor((c-0xAC00)/588)];else out+=s[i];}return out;}

 for(var i=0;i<A.length;i++){
  var hit=isCho?choseong(A[i].n).indexOf(qc)>-1:A[i].n.toLowerCase().indexOf(q)>-1;
  if(hit){out.push(i);if(out.length>=10)break;}}
 return out;}

 if(!confirm("모든 기록·설정을 지우고 처음부터 시작할까요? 되돌릴 수 없어요."))return;
 if(!confirm("정말로요? 내보내기로 백업했는지 확인하세요."))return;
 [LKEY,"slimtrack:v2","bp_entries_v1","bp_checks_v1","bp_lifts_v1","bp_settings_v1","bp_mealmode_v1","bp_mode_v1"].forEach(function(k){localStorage.removeItem(k);});
 location.reload();};

var KEYLIFTS=[["push#0","벤치프레스"],["pull#0","등(풀업/로우)"],["legsA#0","스쿼트"],["legsB#0","데드리프트"],["deltBack#0","사이드 레터럴"]];
function recentDays(n){var arr=[];for(var i=0;i<n;i++){var d=new Date();d.setDate(d.getDate()-i);arr.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));}return arr;}
function daysSince(ds){if(!ds)return null;return Math.round((new Date(TODAY)-new Date(ds))/864e5);}
function weekAvg(){var ds=recentDays(7),ps=[],cs=[],hit=0,PG=dietPhase().protein;ds.forEach(function(d){var e=state.diet[d];if(e&&e.items&&e.items.length){ps.push(e.p);cs.push(e.c);if(e.p>=PG)hit++;}});var avg=function(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):0;};return {ap:avg(ps),ac:avg(cs),logged:ps.length,hit:hit};}
function liftHist(exId){var ds=Object.keys(state.workout).sort(),out=[];ds.forEach(function(d){var r=state.workout[d][exId];if(r&&r.weight&&!isNaN(parseFloat(r.weight)))out.push({date:d,w:parseFloat(r.weight)});});return out;}
function workoutsInWindow(n){var ds=recentDays(n),cnt=0;ds.forEach(function(d){var w=state.workout[d];if(w){var any=false;for(var k in w){if(w[k]&&w[k].done)any=true;}if(any)cnt++;}});return cnt;}
function spark(vals,color){var W=448,H=104,pad=24;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mn===mx){mn-=1;mx+=1;}var x=function(i){return pad+(vals.length<2?0.5:(i/(vals.length-1)))*(W-pad*2);};var y=function(v){return pad+(1-(v-mn)/(mx-mn))*(H-pad*2);};var path=vals.map(function(v,i){return (i?"L":"M")+x(i)+","+y(v);}).join(" ");var dots=vals.map(function(v,i){return '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+color+'"/>';}).join("");return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'<text x="'+pad+'" y="'+(y(mx)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mx+'</text><text x="'+pad+'" y="'+(y(mn)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mn+'</text></svg>';}

function coachSignals(){var dp=dietPhase(),out=[],cut=dp.cut;
 var g=guardInfo();if(g)out.push({t:"warn",x:g});
 /* 체지방 밴드(11~14%) 감시 — 인바디 기록 기반 */
 var bfs=state.metrics.filter(function(m){return m.bf!=null;});
 if(bfs.length){var bf=bfs[bfs.length-1].bf;
  if(!cut&&bf>14)out.push({t:"warn",x:"체지방 "+bf+"% — 밴드(11~14%) 상단 초과. 벌크를 멈추고 미니컷으로 전환할 신호"});
  else if(cut&&bf<=11)out.push({t:"info",x:"체지방 "+bf+"% — 목표 밴드 하단 도달. 컷 조기 종료를 검토하세요 (더 깎으면 근손실 구간)"});}
 KEYLIFTS.forEach(function(k){var h=liftHist(k[0]);if(h.length>=3){var n=h.length,a=h[n-3].w,b=h[n-1].w;if(b<=a&&!deloadActive())out.push({t:"warn",x:k[1]+" 3회째 무게 정체 ("+a+"→"+b+"kg) — 반복수를 한 단계 낮추고 무게를 올려보거나, 오늘 탭 '디로드' 버튼으로 한 주 가볍게 후 재시도"});}});
 var wa=weekAvg();
 if(wa.logged>=3&&wa.ap<Math.round(dp.protein*0.9))out.push({t:"warn",x:"최근 7일 단백질 평균 "+wa.ap+"g (목표 "+dp.protein+"g 미달) — 끼니마다 단백질 한 가지(계란·프로틴·그릭요거트) 추가"});
 var ms=state.metrics.filter(function(m){return m.weight!=null&&daysSince(m.date)!=null&&daysSince(m.date)<=21;}).sort(function(a,b){return a.date.localeCompare(b.date);});
 if(ms.length>=2){var f=ms[0],l=ms[ms.length-1],span=Math.max(1,(new Date(l.date)-new Date(f.date))/864e5),perWk=(l.weight-f.weight)/(span/7);
  if(cut){if(perWk>-0.1&&span>=10)out.push({t:"warn",x:"체중이 "+Math.round(span)+"일간 거의 안 줄었어요 ("+f.weight+"→"+l.weight+"kg) — 칼로리를 약 150 줄이기(탄수에서)"});else if(perWk<-1)out.push({t:"warn",x:"체중 감량이 너무 빨라요 (주 "+(Math.round(perWk*10)/10)+"kg) — 근손실 위험, 살짝 더 먹기"});}
  else{if(perWk<0.05&&span>=14)out.push({t:"info",x:"사이즈업 단계인데 체중이 "+Math.round(span)+"일간 안 늘었어요 — 칼로리를 약 150 늘리기"});else if(perWk>0.6)out.push({t:"warn",x:"체중이 빠르게 늘고 있어요 (주 "+(Math.round(perWk*10)/10)+"kg) — 지방 증가 위험, 칼로리 약간 줄이기"});}}
 var wc=workoutsInWindow(14);
 if(wc<6)out.push({t:"warn",x:"최근 14일 운동 "+wc+"회 — 빈도가 낮아요. 주 4~5회 회복이 우선"});
 if(!out.length)out.push({t:"good",x:"지표가 안정적이에요. 지금 루틴·식단 그대로 유지하면 돼요."});
 return out;}
function summaryText(){var win=recentDays(14),tp=trainPhase(),dp=dietPhase(),L=[];
 L.push("[바프·트랙 2주 점검] "+tp.id+" "+tp.name+" · "+dp.name+" · 블록 "+blockNo());
 L.push("기간: "+win[13]+" ~ "+win[0]+" · 목표 "+dp.goal.toFixed(1)+"kg ("+dp.until+"까지)");
 var ms=state.metrics.filter(function(m){return win.indexOf(m.date)>-1;}).sort(function(a,b){return a.date.localeCompare(b.date);});
 if(ms.length){var f=ms[0],l=ms[ms.length-1];var wl=(f.weight!=null&&l.weight!=null)?(" 체중 "+f.weight+"→"+l.weight+"kg"):"";var wa=(f.waist!=null&&l.waist!=null)?(", 허리 "+f.waist+"→"+l.waist+"cm"):"";var bfl=(f.bf!=null&&l.bf!=null)?(", 체지방 "+f.bf+"→"+l.bf+"%"):"";L.push("몸:"+wl+wa+bfl);}else{L.push("몸: 기록 없음");}
 KEYLIFTS.forEach(function(k){var all=liftHist(k[0]);var inw=all.filter(function(x){return win.indexOf(x.date)>-1;});if(!inw.length)return;var latest=inw[inw.length-1].w;var base=latest;for(var i=all.length-1;i>=0;i--){if(all[i].date<win[13]){base=all[i].w;break;}}if(base===latest&&inw.length>1)base=inw[0].w;var chg=Math.round((latest-base)*10)/10;L.push("· "+k[1]+": "+base+"→"+latest+"kg"+(chg>0?(" (+"+chg+")"):(chg<0?(" ("+chg+")"):"")));});
 var w=weekAvg();L.push("식단(최근7일): 단백질 평균 "+w.ap+"g / 칼로리 "+w.ac+"kcal (목표 "+dp.kcal+"), 단백질목표 "+w.hit+"/"+w.logged+"일 달성");
 L.push("운동: 최근 14일 중 "+workoutsInWindow(14)+"회 완료");
 L.push("— 위 기록 기준으로 다음 2주 무게/볼륨/식단 조정 요청");
 return L.join("\n");}
window.copySummary=function(){var t=summaryText();var ta=document.getElementById('sumText');if(ta){ta.value=t;ta.focus();ta.select();}try{if(navigator.clipboard)navigator.clipboard.writeText(t);else document.execCommand('copy');}catch(e){try{document.execCommand('copy');}catch(e2){}}var b=document.getElementById('copyBtn');if(b){b.textContent="복사됨 ✓";setTimeout(function(){b.textContent="요약 복사";},1500);}};
window.addPhoto=function(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var mw=420,sc=Math.min(1,mw/img.width),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);var data=cv.toDataURL('image/jpeg',0.6);state.photos=state.photos||[];state.photos.push({date:TODAY,img:data});if(state.photos.length>PHOTO_MAX)state.photos=state.photos.slice(-PHOTO_MAX);if(!save()){state.photos.pop();save();alert("저장 공간이 부족해요. 진척 탭에서 오래된 사진을 지우거나, 백업(내보내기) 후 사진을 정리해 주세요.");}render();};img.src=rd.result;};rd.readAsDataURL(f);ev.target.value="";};

function ring(val,goal){var r=34,c=2*Math.PI*r,pct=Math.min(1,val/goal);
 return '<svg width="84" height="84" viewBox="0 0 84 84" style="flex-shrink:0">'+
 '<circle cx="42" cy="42" r="34" fill="none" stroke="#1E252F" stroke-width="8"/>'+
 '<circle cx="42" cy="42" r="34" fill="none" stroke="'+ACC+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'" transform="rotate(-90 42 42)" style="transition:stroke-dashoffset .5s ease"/>'+
 '<text x="42" y="47" text-anchor="middle" fill="'+TX+'" font-size="17" font-weight="700" font-family="JetBrains Mono,monospace">'+Math.round(pct*100)+'%</text></svg>';}

/* ── 체중 차트: 일별(연한 선) + 7일 이동평균(굵은 선, 판정 기준) + 목표선 ── */
function chart(){var pts=state.metrics.filter(function(d){return d.weight!=null;});if(pts.length<2)return "";
 var goal=dietPhase().goal;
 var W=448,H=170,pad=28,ws=pts.map(function(p){return p.weight;});
 var mn=Math.min.apply(null,ws.concat([goal]))-1,mx=Math.max.apply(null,ws.concat([goal]))+1;
 var x=function(i){return pad+(i/(pts.length-1))*(W-pad*2);};
 var y=function(v){return pad+(1-(v-mn)/(mx-mn))*(H-pad*2);};
 var ma=pts.map(function(p,i){var t0=new Date(p.date).getTime();var win=pts.filter(function(q){var t=new Date(q.date).getTime();return t>=t0-6*864e5&&t<=t0;});return win.reduce(function(s,q){return s+q.weight;},0)/win.length;});
 var daily=pts.map(function(p,i){return (i?"L":"M")+x(i)+","+y(p.weight);}).join(" ");
 var maPath=ma.map(function(v,i){return (i?"L":"M")+x(i)+","+y(v);}).join(" ");
 var gy=y(goal);
 var dots=pts.map(function(p,i){return '<circle cx="'+x(i)+'" cy="'+y(p.weight)+'" r="2.5" fill="'+ACC+'" opacity="0.5"/>';}).join("");
 var lastMa=ma[ma.length-1];
 return '<div class="card" style="padding:14px 8px 8px"><div class="mono" style="font-size:11px;color:'+MUT+';padding:0 8px 6px;letter-spacing:.06em">체중 추이 · <span style="color:'+ACC+'">━ 7일 평균(판정 기준)</span> · <span style="opacity:.55;color:'+ACC+'">─ 일별</span> · <span style="color:'+TEAL+'">┄ 목표 '+goal.toFixed(1)+'</span></div>'+
 '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+
 '<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="'+TEAL+'" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>'+
 '<text x="'+(W-pad)+'" y="'+(gy-4)+'" text-anchor="end" fill="'+TEAL+'" font-size="10" font-family="monospace">'+goal.toFixed(1)+'</text>'+
 '<path d="'+daily+'" fill="none" stroke="'+ACC+'" stroke-width="1.5" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
 '<path d="'+maPath+'" fill="none" stroke="'+ACC+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
 '<text x="'+(x(pts.length-1)-4)+'" y="'+(y(lastMa)-8)+'" text-anchor="end" fill="'+TX+'" font-size="11" font-weight="700" font-family="monospace">'+lastMa.toFixed(1)+'</text>'+
 '<text x="'+pad+'" y="'+(y(mx)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mx.toFixed(0)+'</text>'+
 '<text x="'+pad+'" y="'+(y(mn)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mn.toFixed(0)+'</text></svg></div>';}

  '<button onclick="resetAll()" style="width:100%;margin-top:8px;background:transparent;border:1px solid '+CRIT+'55;color:'+CRIT+';border-radius:9px;padding:10px 0;font-size:13px">전체 데이터 초기화</button></div>';
 return '<div class="pane">'+
  '<div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px">2026 → 2030 프로그램</div>'+
  (isMaint()?'<div class="card" style="padding:12px 14px;margin-bottom:14px;border-color:'+TEAL+'55"><span class="mono" style="font-size:11px;color:'+TEAL+'">유지 모드</span><div style="font-size:12px;color:'+MUT+';margin-top:4px">5단계 프로그램을 완료했어요. 지금 체형을 유지하며 P5 루틴·식단을 그대로 쓰면 돼요.</div></div>':'<div style="font-size:12px;color:'+MUT+';margin-bottom:14px">날짜가 지나면 훈련 단계(P1~P5)와 식단 단계(컷/벌크)가 각각 자동 전환된다. 무게는 본인 기록에서 자동 계산.</div>')+
  '<div style="display:flex;gap:4px;margin-bottom:16px">'+segs+'</div>'+cards+
  roadmap+miles+checklist+settings+
  '<div style="font-size:11px;color:'+MUT+';margin-top:10px;line-height:1.5">정체되거나 사진으로 조정하고 싶을 때는 진척 탭 → 내보내기로 기록을 코치에게 전달하면 그 2주만 미세조정.</div></div>';}

function render(){var tp=trainPhase(),dp=dietPhase();
 var body=state.tab==="today"?viewToday():state.tab==="fuel"?viewFuel():state.tab==="plan"?viewPlan():viewProgress();
 var tabs=[["today","오늘"],["fuel","연료"],["progress","진척"],["plan","플랜"]].map(function(t){return '<button class="tabbtn'+(state.tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("");
 document.getElementById("app").innerHTML=
  '<div class="wrap"><div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:4px">'+
  '<div style="font-weight:700;font-size:19px;letter-spacing:-.02em">바프<span style="color:'+ACC+'">·</span>트랙</div>'+
  '<div class="mono" style="font-size:11px;color:'+MUT+'">'+(isMaint()?'유지 모드 · '+tp.id:tp.id+' · '+dp.name)+'</div></div>'+
  '<div style="height:3px;background:'+SURF2+';border-radius:2px;margin-bottom:22px;overflow:hidden"><div style="width:'+(overallPct()*100)+'%;height:100%;background:'+ACC+'"></div></div>'+
  body+'</div>'+
  '<div class="tabbar"><div class="tabbar-in">'+tabs+'</div></div>'+
  ((PVIEW!=null&&state.photos&&state.photos[PVIEW])?'<div onclick="closePhoto()" style="position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"><img src="'+state.photos[PVIEW].img+'" style="max-width:100%;max-height:88vh;border-radius:10px"><div style="position:absolute;top:16px;right:20px;color:#fff;font-size:26px">×</div></div>':'');}

render();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
