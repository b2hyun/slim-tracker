.tabbtn{flex:1;padding:13px 0 17px;font-size:12px;font-weight:600;border-top:2px solid transparent;margin-top:-1px;color:var(--mut)}
.tabbtn.on{color:var(--acc);border-top-color:var(--acc)}

.pane{animation:fade .22s ease}

var SQ="",SSEL=null,PVIEW=null;
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var TODAY=todayStr(),DOW=new Date().getDay();

var state={mode:"home",workout:{},diet:{},metrics:[],tab:"today",plan:"A",photos:[],lastBackup:null};
try{var raw=localStorage.getItem("slimtrack:v2");if(raw){state=Object.assign(state,JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem("slimtrack:v2",JSON.stringify({mode:state.mode,workout:state.workout,diet:state.diet,metrics:state.metrics,plan:state.plan,photos:state.photos,lastBackup:state.lastBackup}));return true;}catch(e){return false;}}

function curPhaseIdx(){var t=new Date(),idx=0;for(var i=0;i<PHASES.length;i++){if(PHASES[i].start<=t)idx=i;}return idx;}
function curPhase(){return PHASES[curPhaseIdx()];}
function blockNo(){var wk=Math.floor((new Date()-START)/(7*864e5));return Math.max(1,Math.floor(wk/2)+1);}
function overallPct(){return Math.max(0,Math.min(1,(new Date()-START)/(END-START)));}
var PHOTO_MAX=60;
function isMaint(){return new Date()>END;}

function dayLog(){return state.workout[TODAY]||(state.workout[TODAY]={});}
function lastWeight(exId){var ds=Object.keys(state.workout).filter(function(d){return d<TODAY;}).sort().reverse();for(var k=0;k<ds.length;k++){var rec=state.workout[ds[k]][exId];if(rec&&rec.weight)return rec.weight;}return null;}
function incOf(t){return t==="iso"||t==="core"?1:2.5;}
function diet(){var d=state.diet[TODAY]||(state.diet[TODAY]={p:0,c:0,items:[]});if(d.items===undefined)d.items=[];return d;}
function addItem(name,p,c){var d=diet();d.items.push({n:name,p:p,c:c});d.p+=p;d.c+=c;save();render();}

window.setTab=function(t){state.tab=t;render();};
window.setMode=function(m){state.mode=m;save();render();};
window.tt=function(id){var dl=dayLog();dl[id]=dl[id]||{};dl[id].done=!dl[id].done;save();render();};
window.setW=function(id,v){var dl=dayLog();dl[id]=dl[id]||{};dl[id].weight=v;save();};
window.addFood=function(i){addItem(FOODS[i].n,FOODS[i].p,FOODS[i].c);};
window.setPlan=function(id){state.plan=id;save();render();};
window.addMeal=function(name,p,c){addItem(name,p,c);};
window.addDay=function(planId){var mp=MEALPLANS.filter(function(x){return x.id===planId;})[0];mp.meals.forEach(function(m){var d=diet();d.items.push({n:planId+" "+m.t,p:m.p,c:m.c});d.p+=m.p;d.c+=m.c;});save();render();};
window.delItem=function(i){var d=diet();var it=d.items[i];if(!it)return;d.p-=it.p;d.c-=it.c;if(d.p<0)d.p=0;if(d.c<0)d.c=0;d.items.splice(i,1);save();render();};
function fdMatch(){var q=SQ.trim().toLowerCase();if(!q)return [];var out=[];for(var i=0;i<FOODDB.length;i++){if(FOODDB[i].n.toLowerCase().indexOf(q)>-1){out.push(i);if(out.length>=8)break;}}return out;}
function searchResultsHTML(){if(!SQ.trim())return "";var m=fdMatch();if(!m.length)return '<div style="font-size:12px;color:'+MUT+';padding:10px 2px">검색 결과 없음 — 아래 빠른 추가를 쓰거나 다른 이름으로 검색</div>';
 return m.map(function(idx){var f=FOODDB[idx],sel=SSEL===idx;return '<button onclick="pickFood('+idx+')" class="row" style="width:100%;justify-content:space-between;background:'+SURF2+';border:1px solid '+(sel?ACC:LINE)+';border-radius:9px;padding:9px 12px;margin-top:6px;text-align:left;color:'+TX+'"><div style="min-width:0"><span style="font-size:13px;font-weight:500">'+f.n+'</span> <span style="font-size:11px;color:'+MUT+'">'+f.u+'</span></div><div class="mono" style="font-size:11px;color:'+ACC+';white-space:nowrap;margin-left:8px">'+f.p+'P · '+f.c+'kcal</div></button>';}).join("");}
function qtyHTML(){if(SSEL==null)return "";var f=FOODDB[SSEL];
 var mults=[0.5,1,1.5,2].map(function(m){return '<button onclick="addQty('+SSEL+','+m+')" style="flex:1;background:'+SURF2+';border:1px solid '+LINE+';border-radius:8px;padding:9px 0;font-size:13px;font-weight:600;color:'+TX+'">'+m+'×</button>';}).join("");
 var cnt='<div style="display:flex;gap:6px;margin-top:8px"><input id="cntIn" inputmode="decimal" placeholder="'+f.u+' 개수 직접 (예: 7)" style="flex:1;background:'+SURF2+';border:1px solid '+LINE+';border-radius:8px;color:'+TX+';padding:9px 10px;font-size:13px;text-align:center"><button onclick="addCnt('+SSEL+')" style="background:'+ACC+';color:#1a1206;font-weight:700;border-radius:8px;padding:9px 16px;font-size:13px">추가</button></div>';
 var per=f.g100p!=null?[f.g100p,f.g100c]:(f.u.indexOf("100g")>-1?[f.p,f.c]:null);
 var grams=per?'<div style="display:flex;gap:6px;margin-top:8px"><input id="gramIn" inputmode="decimal" placeholder="그램(g) 직접 입력" style="flex:1;background:'+SURF2+';border:1px solid '+LINE+';border-radius:8px;color:'+TX+';padding:9px 10px;font-size:13px;text-align:center"><button onclick="addGrams('+SSEL+')" style="background:'+ACC+';color:#1a1206;font-weight:700;border-radius:8px;padding:9px 16px;font-size:13px">g 추가</button></div>':'';
 return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid '+LINE+'"><div style="font-size:12px;color:'+MUT+';margin-bottom:8px"><b style="color:'+TX+'">'+f.n+'</b> · '+f.u+' 기준 · 양 선택</div><div style="display:flex;gap:6px">'+mults+'</div>'+cnt+grams+'</div>';}
window.searchInput=function(v){SQ=v;SSEL=null;var r=document.getElementById('searchRes');if(r)r.innerHTML=searchResultsHTML();var q=document.getElementById('qtyBox');if(q)q.innerHTML="";};
window.pickFood=function(idx){SSEL=idx;var r=document.getElementById('searchRes');if(r)r.innerHTML=searchResultsHTML();var q=document.getElementById('qtyBox');if(q)q.innerHTML=qtyHTML();};

function spark(vals,color){var W=448,H=104,pad=24;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mn===mx){mn-=1;mx+=1;}var x=function(i){return pad+(vals.length<2?0.5:(i/(vals.length-1)))*(W-pad*2);};var y=function(v){return pad+(1-(v-mn)/(mx-mn))*(H-pad*2);};var path=vals.map(function(v,i){return (i?"L":"M")+x(i)+","+y(v);}).join(" ");var dots=vals.map(function(v,i){return '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+color+'"/>';}).join("");return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'<text x="'+pad+'" y="'+(y(mx)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mx+'</text><text x="'+pad+'" y="'+(y(mn)+3)+'" fill="'+MUT+'" font-size="10" font-family="monospace">'+mn+'</text></svg>';}
function coachSignals(){var ph=curPhase(),out=[],cut=(ph.id==="P1"||ph.id==="P5");
 KEYLIFTS.forEach(function(k){var h=liftHist(k[0]);if(h.length>=3){var n=h.length,a=h[n-3].w,b=h[n-1].w;if(b<=a)out.push({t:"warn",x:k[1]+" 3회째 무게 정체 ("+a+"→"+b+"kg) — 반복수를 한 단계 낮추고 무게를 올려보거나, 한 주 가볍게(디로드) 후 재시도"});}});
 var wa=weekAvg();
 if(wa.logged>=3&&wa.ap<Math.round(ph.diet.protein*0.9))out.push({t:"warn",x:"최근 7일 단백질 평균 "+wa.ap+"g (목표 "+ph.diet.protein+"g 미달) — 끼니마다 단백질 한 가지(계란·프로틴·그릭요거트) 추가"});
 var ms=state.metrics.filter(function(m){return m.weight!=null&&daysSince(m.date)!=null&&daysSince(m.date)<=21;}).sort(function(a,b){return a.date.localeCompare(b.date);});
 if(ms.length>=2){var f=ms[0],l=ms[ms.length-1],span=Math.max(1,(new Date(l.date)-new Date(f.date))/864e5),perWk=(l.weight-f.weight)/(span/7);
  if(cut){if(perWk>-0.1&&span>=10)out.push({t:"warn",x:"체중이 "+Math.round(span)+"일간 거의 안 줄었어요 ("+f.weight+"→"+l.weight+"kg) — 칼로리를 약 150 줄이기(탄수에서)"});else if(perWk<-1)out.push({t:"warn",x:"체중 감량이 너무 빨라요 (주 "+(Math.round(perWk*10)/10)+"kg) — 근손실 위험, 살짝 더 먹기"});}
  else{if(perWk<0.05&&span>=14)out.push({t:"info",x:"사이즈업 단계인데 체중이 "+Math.round(span)+"일간 안 늘었어요 — 칼로리를 약 150 늘리기"});else if(perWk>0.6)out.push({t:"warn",x:"체중이 빠르게 늘고 있어요 (주 "+(Math.round(perWk*10)/10)+"kg) — 지방 증가 위험, 칼로리 약간 줄이기"});}}
 var wc=workoutsInWindow(14);

 if(!out.length)out.push({t:"good",x:"지표가 안정적이에요. 지금 루틴·식단 그대로 유지하면 돼요."});
 return out;}

  '<div class="card" style="padding:22px 20px;display:flex;align-items:center;gap:22px;margin-bottom:12px">'+ring(d.p,PG)+
  '<div><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em">단백질 / PROTEIN</div>'+
  '<div class="mono" style="font-size:28px;font-weight:700">'+d.p+'<span style="font-size:15px;color:'+MUT+'"> / '+PG+'g</span></div>'+
  '<div style="font-size:12px;color:'+(d.p>=PG?TEAL:MUT)+';margin-top:2px">'+(d.p>=PG?'목표 달성 ✓':(PG-d.p)+'g 남음')+'</div></div></div>'+
  '<div class="card" style="padding:16px;margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em">칼로리 / KCAL</span><span class="mono" style="font-size:13px">'+d.c+' / '+CG+'</span></div>'+
  '<div style="height:8px;background:'+SURF2+';border-radius:5px;overflow:hidden"><div style="width:'+Math.min(100,(d.c/CG)*100)+'%;height:100%;background:'+(d.c>CG?'#E0533D':TEAL)+'"></div></div></div>'+
  log+search+rec+
  '<div class="row" style="justify-content:space-between;margin-bottom:10px"><span style="font-size:13px;color:'+MUT+'">빠른 추가</span></div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+foods+'</div></div>';}

function viewProgress(){
 var empty=state.metrics.filter(function(d){return d.weight!=null;}).length<2?'<div class="card" style="padding:24px 20px;text-align:center;color:'+MUT+';margin-top:12px">체중 기록이 2개 이상이면 추이가 그려져요.</div>':'';
 var wa=weekAvg(),PG=curPhase().diet.protein,CG=curPhase().diet.cal;
 var week='<div class="card" style="padding:16px;margin-top:12px"><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em;margin-bottom:12px">이번 주 평균 (최근 7일)</div>'+
  '<div style="display:flex;gap:10px;text-align:center">'+
  '<div style="flex:1;background:'+SURF2+';border-radius:10px;padding:12px 6px"><div class="mono" style="font-size:22px;font-weight:700;color:'+(wa.ap>=PG?TEAL:TX)+'">'+wa.ap+'</div><div style="font-size:11px;color:'+MUT+'">단백질 g (목표 '+PG+')</div></div>'+
  '<div style="flex:1;background:'+SURF2+';border-radius:10px;padding:12px 6px"><div class="mono" style="font-size:22px;font-weight:700">'+wa.ac+'</div><div style="font-size:11px;color:'+MUT+'">칼로리 (목표 '+CG+')</div></div>'+
  '<div style="flex:1;background:'+SURF2+';border-radius:10px;padding:12px 6px"><div class="mono" style="font-size:22px;font-weight:700;color:'+ACC+'">'+wa.hit+'/'+wa.logged+'</div><div style="font-size:11px;color:'+MUT+'">단백질 목표일</div></div></div></div>';
 var liftCards=KEYLIFTS.map(function(k){var h=liftHist(k[0]);if(h.length<2)return "";var vals=h.map(function(x){return x.w;});var chg=vals[vals.length-1]-vals[0];return '<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:2px"><span style="font-size:13px;font-weight:500">'+k[1]+'</span><span class="mono" style="font-size:11px;color:'+(chg>0?TEAL:MUT)+'">'+vals[0]+'→'+vals[vals.length-1]+'kg'+(chg>0?(" (+"+Math.round(chg*10)/10+")"):"")+'</span></div>'+spark(vals,ACC)+'</div>';}).join("");
 var liftSection='<div class="card" style="padding:16px;margin-top:12px"><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em;margin-bottom:12px">주요 운동 추이</div>'+(liftCards||'<div style="font-size:12px;color:'+MUT+'">주요 종목 무게를 2회 이상 기록하면 그래프가 그려져요.</div>')+'</div>';
 var photos=(state.photos||[]);
 var thumbs=photos.length?'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px">'+photos.map(function(p,i){return '<div style="position:relative"><img src="'+p.img+'" onclick="openPhoto('+i+')" style="width:100%;border-radius:8px;display:block;aspect-ratio:3/4;object-fit:cover"><div class="mono" style="position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 5px;font-size:9px">'+p.date.slice(5)+'</div><button onclick="delPhoto('+i+')" style="position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1">×</button></div>';}).join("")+'</div>':'<div style="font-size:12px;color:'+MUT+';margin-top:8px">2주마다 정면·측면 사진을 남기면 변화가 가장 잘 보여요.</div>';
 var photoWarn=(photos.length>=PHOTO_MAX-5)?'<div style="font-size:11px;color:'+ACC+';margin-top:8px">사진 한도('+PHOTO_MAX+'장)에 근접했어요. 한도를 넘으면 가장 오래된 사진이 자동 삭제돼요 — 백업(내보내기)으로 보관하세요.</div>':'';
 var photoCard='<div class="card" style="padding:16px;margin-top:12px"><div class="row" style="justify-content:space-between"><span class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em">사진 기록 ('+photos.length+'/'+PHOTO_MAX+')</span><label style="background:'+ACC+';color:#1a1206;font-weight:700;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer">+ 사진<input type="file" accept="image/*" onchange="addPhoto(event)" style="display:none"></label></div>'+thumbs+photoWarn+'</div>';
 var summary='<div class="card" style="padding:16px;margin-top:12px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em">2주 점검 요약</span><button id="copyBtn" onclick="copySummary()" style="background:'+ACC+';color:#1a1206;font-weight:700;border-radius:8px;padding:6px 12px;font-size:12px">요약 복사</button></div>'+
  '<textarea id="sumText" readonly style="width:100%;height:150px;background:'+SURF2+';border:1px solid '+LINE+';border-radius:9px;color:'+TX+';padding:10px;font-size:11px;line-height:1.5;resize:none" class="mono">'+summaryText().replace(/</g,"&lt;")+'</textarea>'+
  '<div style="font-size:11px;color:'+MUT+';margin-top:8px">복사해서 코치에게 붙여넣으면 다음 2주를 조정해줘요.</div></div>';
 var lb=state.lastBackup,dsb=daysSince(lb),stale=(dsb==null||dsb>=7);
 var backup='<div class="card" style="padding:16px;margin-top:12px;border-color:'+(stale?ACC:LINE)+'"><div class="mono" style="font-size:11px;color:'+(stale?ACC:MUT)+';letter-spacing:.06em;margin-bottom:10px">데이터 백업 · 마지막 '+(lb?dsb+"일 전":"없음")+'</div>'+
  (stale?'<div style="font-size:12px;color:'+ACC+';margin-bottom:10px">백업한 지 오래됐어요. 폰을 바꾸거나 캐시를 지우면 기록이 사라지니 내보내기를 권장해요.</div>':'')+
  '<div style="display:flex;gap:8px"><button onclick="exportData()" style="flex:1;background:'+(stale?ACC:SURF2)+';border:1px solid '+LINE+';color:'+(stale?'#1a1206':TX)+';border-radius:9px;padding:11px 0;font-size:13px;font-weight:600">내보내기</button>'+
  '<label style="flex:1;background:'+SURF2+';border:1px solid '+LINE+';color:'+TX+';border-radius:9px;padding:11px 0;font-size:13px;font-weight:600;text-align:center;cursor:pointer">가져오기<input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label></div>'+
  '<div style="font-size:11px;color:'+MUT+';margin-top:8px">사진까지 함께 백업돼요. 가져오면 현재 기록을 덮어써요.</div></div>';
 return '<div class="pane">'+
  '<div class="card" style="padding:16px;margin-bottom:12px"><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em;margin-bottom:8px">코칭 신호</div>'+
  coachSignals().map(function(s){var col=s.t==="warn"?ACC:s.t==="good"?TEAL:MUT;var mk=s.t==="warn"?"!":s.t==="good"?"✓":"·";return '<div class="row" style="align-items:flex-start;gap:10px;padding:7px 0"><div style="width:20px;height:20px;flex-shrink:0;border-radius:6px;background:'+col+'22;color:'+col+';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">'+mk+'</div><div style="font-size:13px;line-height:1.45">'+s.x+'</div></div>';}).join("")+'</div>'+
  '<div class="card" style="padding:16px;margin-bottom:12px"><div class="mono" style="font-size:11px;color:'+MUT+';letter-spacing:.06em;margin-bottom:12px">오늘 기록</div>'+
  '<div style="display:flex;gap:10px">'+
  '<div style="flex:1"><div style="font-size:11px;color:'+MUT+';margin-bottom:6px">체중 kg</div><input id="mw" inputmode="decimal" placeholder="76.0" style="width:100%;background:'+SURF2+';border:1px solid '+LINE+';border-radius:9px;color:'+TX+';padding:10px;font-size:15px;text-align:center"></div>'+
  '<div style="flex:1"><div style="font-size:11px;color:'+MUT+';margin-bottom:6px">허리 cm</div><input id="mwaist" inputmode="decimal" placeholder="82" style="width:100%;background:'+SURF2+';border:1px solid '+LINE+';border-radius:9px;color:'+TX+';padding:10px;font-size:15px;text-align:center"></div>'+
  '<button onclick="addMetric()" style="align-self:flex-end;background:'+ACC+';border-radius:9px;color:#1a1206;font-weight:700;padding:10px 16px;font-size:14px">기록</button></div></div>'+
  chart()+empty+week+liftSection+photoCard+summary+backup+'</div>';}

function viewPhases(){var ci=curPhaseIdx();
 var segs=PHASES.map(function(p,i){return '<div style="flex:1;height:6px;background:'+(i<=ci?ACC:SURF2)+';border-radius:2px"></div>';}).join("");
 var cards=PHASES.map(function(p,i){var on=i===ci;var yr=p.start.getFullYear();
  return '<div class="card" style="padding:14px;margin-bottom:8px;border-color:'+(on?ACC:LINE)+';'+(on?'':'opacity:.7')+'">'+
   '<div class="row" style="justify-content:space-between"><span class="mono" style="font-size:12px;color:'+(on?ACC:MUT)+'">'+p.id+' · '+p.name+'</span>'+
   '<span class="mono" style="font-size:11px;color:'+MUT+'">'+yr+(on?' · 진행중':'')+'</span></div>'+
   '<div style="font-size:13px;margin-top:6px">'+p.focus+'</div>'+
   '<div class="mono" style="font-size:11px;color:'+MUT+';margin-top:6px">식단 '+p.diet.cal+'kcal · 단백질 '+p.diet.protein+'g · '+p.diet.note+'</div>'+
   '<div class="mono" style="font-size:11px;color:'+MUT+';margin-top:3px">메인 '+p.reps.main+' · 보조 '+p.reps.acc+'</div></div>';
 }).join("");
 return '<div class="pane">'+
  '<div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px">2026 → 2030 프로그램</div>'+
  (isMaint()?'<div class="card" style="padding:12px 14px;margin-bottom:14px;border-color:'+TEAL+'55"><span class="mono" style="font-size:11px;color:'+TEAL+'">유지 모드</span><div style="font-size:12px;color:'+MUT+';margin-top:4px">5단계 프로그램을 완료했어요. 지금 체형을 유지하며 P5 루틴·식단을 그대로 쓰면 돼요. 새 목표(사이즈 추가 등)로 다시 달리고 싶으면 코치에게 말해 단계를 갱신하세요.</div></div>':'<div style="font-size:12px;color:'+MUT+';margin-bottom:14px">날짜가 지나면 단계가 자동 전환된다. 무게는 본인 기록에서 자동 계산.</div>')+
  '<div style="display:flex;gap:4px;margin-bottom:16px">'+segs+'</div>'+cards+
  '<div style="font-size:11px;color:'+MUT+';margin-top:6px;line-height:1.5">정체되거나 사진으로 조정하고 싶을 때는 진척 탭 → 내보내기로 기록을 코치에게 전달하면 그 2주만 미세조정.</div></div>';}

function render(){var ph=curPhase();
 var body=state.tab==="today"?viewToday():state.tab==="fuel"?viewFuel():state.tab==="phases"?viewPhases():viewProgress();
 var tabs=[["today","오늘"],["fuel","연료"],["progress","진척"],["phases","단계"]].map(function(t){return '<button class="tabbtn'+(state.tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("");
 document.getElementById("app").innerHTML=
  '<div class="wrap"><div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:4px">'+
  '<div style="font-weight:700;font-size:19px;letter-spacing:-.02em">SLIM<span style="color:'+ACC+'">·</span>TRACK</div>'+
  '<div class="mono" style="font-size:11px;color:'+MUT+'">'+(isMaint()?'유지 모드 · '+ph.id:ph.id+' · 블록 '+blockNo())+'</div></div>'+
  '<div style="height:3px;background:'+SURF2+';border-radius:2px;margin-bottom:22px;overflow:hidden"><div style="width:'+(overallPct()*100)+'%;height:100%;background:'+ACC+'"></div></div>'+
  body+'</div>'+
  '<div class="tabbar"><div class="tabbar-in">'+tabs+'</div></div>'+
  ((PVIEW!=null&&state.photos&&state.photos[PVIEW])?'<div onclick="closePhoto()" style="position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"><img src="'+state.photos[PVIEW].img+'" style="max-width:100%;max-height:88vh;border-radius:10px"><div style="position:absolute;top:16px;right:20px;color:#fff;font-size:26px">×</div></div>':'');}

render();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
